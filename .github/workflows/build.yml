name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Minimal Dependencies
        run: |
          sudo apt-get update
          # فقط پکیج‌های حیاتی که در تست سبز بودند را نصب می‌کنیم
          sudo apt-get install -y build-essential git python3-dev libssl-dev libffi-dev libsqlite3-dev libncurses5 libncursesw5 libtinfo5 zlib1g-dev
          
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33
          pip install buildozer

      - name: Build with Buildozer
        run: |
          # شروع عملیات ساخت اصلی
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tracker-apk
          path: bin/*.apk
