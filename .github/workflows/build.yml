name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # تغییر از ubuntu-latest به نسخه قدیمی‌تر و پایدارتر
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # استفاده از پایتون 3.10 که با Buildozer سازگارتر است

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade Cython==0.29.33
          pip install buildozer

      - name: Build with Buildozer
        run: |
          # اضافه کردن فلگ برای مشاهده جزئیات بیشتر در صورت خطا
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tracker-apk
          path: bin/*.apk
