name: Debugging Package Installation

on:
  push:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Test Package Installation
        run: |
          sudo apt-get update
          echo "Attempting to install critical packages..."
          sudo apt-get install -y build-essential git python3-dev libssl-dev libffi-dev libsqlite3-dev
          echo "Installation successful!"
